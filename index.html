<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>K-Pop Hitster</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            width: min(900px, 95vw);
            text-align: center;
        }

        h1 {
            margin-bottom: 30px;
        }

        #player-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: black;
        }

        #player {
            width: 100%;
            height: 100%;
        }

        #status {
            margin-top: 20px;
            color: #aaa;
        }

        .error {
            color: #ff6b6b;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>K-Pop Hitster</h1>

    <div id="player-container">
        <div id="player"></div>
    </div>

    <div id="status">
        Loading...
    </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
    let songs = [];
    let currentSong = null;
    let player = null;
    let stopTimer = null;


    // -----------------------------------------
    // Get card number from URL
    // Example:
    // ?card=42
    // -----------------------------------------

    const params = new URLSearchParams(window.location.search);
    const cardId = Number(params.get("card"));


    // -----------------------------------------
    // Load song database
    // -----------------------------------------

    fetch("songs.json")
        .then(response => {
            if (!response.ok) {
                throw new Error("Could not load songs.json");
            }

            return response.json();
        })
        .then(data => {
            songs = data;

            currentSong = songs.find(song => song.id === cardId);

            if (!currentSong) {
                showError("Card not found.");
                return;
            }

            document.getElementById("status").textContent =
                `Card ${currentSong.id}`;
        })
        .catch(error => {
            console.error(error);
            showError("Could not load the song database.");
        });


    // -----------------------------------------
    // YouTube calls this when its API is ready
    // -----------------------------------------

    function onYouTubeIframeAPIReady() {

        // Wait until songs.json has loaded
        if (!currentSong) {
            setTimeout(onYouTubeIframeAPIReady, 100);
            return;
        }

        createPlayer();
    }


    // -----------------------------------------
    // Create YouTube player
    // -----------------------------------------

    function createPlayer() {

        player = new YT.Player("player", {

            videoId: currentSong.videoId,

            playerVars: {
                autoplay: 1,
                controls: 1,
                rel: 0,
                modestbranding: 1
            },

            events: {
                onReady: onPlayerReady,
                onStateChange: onPlayerStateChange,
                onError: onPlayerError
            }
        });
    }


    // -----------------------------------------
    // Start the song at our chosen timestamp
    // -----------------------------------------

    function onPlayerReady(event) {

        event.target.seekTo(currentSong.start, true);
        event.target.playVideo();

        scheduleStop();
    }


    // -----------------------------------------
    // Stop the song at our chosen timestamp
    // -----------------------------------------

    function scheduleStop() {

        clearTimeout(stopTimer);

        const duration =
            (currentSong.end - currentSong.start) * 1000;

        stopTimer = setTimeout(() => {

            if (player) {
                player.pauseVideo();
            }

            document.getElementById("status").textContent =
                "Clip finished.";

        }, duration);
    }


    // -----------------------------------------
    // Keep the player inside our time range
    // -----------------------------------------

    function onPlayerStateChange(event) {

        if (event.data === YT.PlayerState.PLAYING) {

            const currentTime = player.getCurrentTime();

            if (currentTime < currentSong.start) {
                player.seekTo(currentSong.start, true);
            }

            scheduleStop();
        }
    }


    // -----------------------------------------
    // Handle YouTube errors
    // -----------------------------------------

    function onPlayerError(event) {

        console.error("YouTube error:", event.data);

        showError(
            "This YouTube video cannot be played."
        );
    }


    function showError(message) {

        const status = document.getElementById("status");

        status.textContent = message;
        status.classList.add("error");
    }
</script>

</body>
</html>
