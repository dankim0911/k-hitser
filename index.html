<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>K-Pop Hitster</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            width: min(900px, 95vw);
            margin: 0 auto;
            padding: 32px 0 48px;
            text-align: center;
        }

        h1 {
            margin: 0 0 24px;
        }

        #play-song {
            min-width: 220px;
            min-height: 60px;
            padding: 14px 24px;
            border: 0;
            border-radius: 4px;
            background: #fff;
            color: #111;
            font: 700 20px Arial, sans-serif;
            cursor: pointer;
        }

        #play-song:disabled {
            cursor: wait;
            opacity: 0.65;
        }

        #play-song:focus-visible {
            outline: 3px solid #ff6b6b;
            outline-offset: 3px;
        }

        #player-container {
            position: relative;
            width: 100%;
            margin-top: 100vh;
            aspect-ratio: 16 / 9;
            background: black;
            scroll-margin-block: 16px;
        }

        #player {
            width: 100%;
            height: 100%;
        }

        #status {
            margin-top: 20px;
            min-height: 1.5em;
            color: #aaa;
        }

        .error {
            color: #ff6b6b;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>K-Pop Hitster</h1>

    <button id="play-song" type="button" disabled>Loading song...</button>
    <div id="status" role="status" aria-live="polite">
        Loading...
    </div>

    <div id="player-container">
        <div id="player"></div>
    </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
    let songs = [];
    let currentSong = null;
    let player = null;
    let stopTimer = null;
    let playerReady = false;
    let playRequestPending = false;
    let playbackRequested = false;

    const playButton = document.getElementById("play-song");
    const playerContainer = document.getElementById("player-container");
    const status = document.getElementById("status");

    playButton.addEventListener("click", requestPlayback);


    // -----------------------------------------
    // Get card number from URL
    // Example:
    // ?card=42
    // -----------------------------------------

    const params = new URLSearchParams(window.location.search);
    const cardId = Number(params.get("card"));


    // -----------------------------------------
    // Load song database
    // -----------------------------------------

    fetch("songs.json")
        .then(response => {
            if (!response.ok) {
                throw new Error("Could not load songs.json");
            }

            return response.json();
        })
        .then(data => {
            songs = data;

            currentSong = songs.find(song => song.id === cardId);

            if (!currentSong) {
                playButton.textContent = "PLAY SONG";
                showError("Card not found.");
                return;
            }

            status.textContent = "Preparing song...";
        })
        .catch(error => {
            console.error(error);
            showError("Could not load the song database.");
        });


    // -----------------------------------------
    // YouTube calls this when its API is ready
    // -----------------------------------------

    function onYouTubeIframeAPIReady() {

        // Wait until songs.json has loaded
        if (!currentSong) {
            setTimeout(onYouTubeIframeAPIReady, 100);
            return;
        }

        createPlayer();
    }


    // -----------------------------------------
    // Create YouTube player
    // -----------------------------------------

    function createPlayer() {

        player = new YT.Player("player", {

            videoId: currentSong.videoId,

            playerVars: {
                autoplay: 0,
                controls: 1,
                rel: 0,
                modestbranding: 1,
                playsinline: 1
            },

            events: {
                onReady: onPlayerReady,
                onStateChange: onPlayerStateChange,
                onAutoplayBlocked: showPlayButton,
                onError: onPlayerError
            }
        });
    }


    // -----------------------------------------
    // Start the song at our chosen timestamp
    // -----------------------------------------

    function onPlayerReady(event) {
        event.target.seekTo(currentSong.start, true);
        playerReady = true;
        playButton.disabled = false;
        playButton.textContent = "PLAY SONG";
        status.textContent = "Ready";
    }


    function requestPlayback() {
        if (!playerReady || playRequestPending) {
            return;
        }

        if (!("IntersectionObserver" in window)) {
            playerContainer.scrollIntoView({ behavior: "smooth", block: "center" });
            status.textContent = "Use the YouTube player controls to start playback.";
            return;
        }

        playRequestPending = true;
        playButton.disabled = true;
        status.textContent = "Opening player...";

        const observer = new IntersectionObserver((entries) => {
            const playerIsVisible = entries.some(entry =>
                entry.isIntersecting && entry.intersectionRatio >= 0.5
            );

            if (!playerIsVisible) {
                return;
            }

            observer.disconnect();
            playRequestPending = false;
            playButton.disabled = false;
            playbackRequested = true;
            status.textContent = "Starting song...";
            player.seekTo(currentSong.start, true);
            player.playVideo();
        }, { threshold: 0.5 });

        observer.observe(playerContainer);
        playerContainer.scrollIntoView({ behavior: "smooth", block: "center" });
    }


    function showPlayButton() {
        if (!playbackRequested) {
            return;
        }

        playbackRequested = false;
        status.textContent = "Playback was blocked. Use the visible YouTube player controls to play.";
    }


    // -----------------------------------------
    // Loop the clip at our chosen timestamp
    // -----------------------------------------

    function scheduleLoop() {

        clearTimeout(stopTimer);

        const duration =
            (currentSong.end - currentSong.start) * 1000;

        stopTimer = setTimeout(() => {

            if (player && player.getPlayerState() === YT.PlayerState.PLAYING) {
                player.seekTo(currentSong.start, true);
                player.playVideo();
                scheduleLoop();
            }

        }, duration);
    }


    // -----------------------------------------
    // Keep the player inside our time range
    // -----------------------------------------

    function onPlayerStateChange(event) {

        if (event.data === YT.PlayerState.PLAYING) {
            playbackRequested = false;
            status.textContent = `Card ${currentSong.id}`;

            const currentTime = player.getCurrentTime();

            if (currentTime < currentSong.start || currentTime >= currentSong.end) {
                player.seekTo(currentSong.start, true);
            }

            scheduleLoop();
        }
    }


    // -----------------------------------------
    // Handle YouTube errors
    // -----------------------------------------

    function onPlayerError(event) {

        console.error("YouTube error:", event.data);
        playButton.disabled = true;

        showError(
            "This YouTube video cannot be played."
        );
    }


    function showError(message) {

        status.textContent = message;
        status.classList.add("error");
    }
</script>

</body>
</html>
